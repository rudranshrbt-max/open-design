services:
  - type: web
    name: open-design
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerCommand: node /app/apps/daemon/dist/cli.js --no-open
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: RENDER
        value: "true"
      - key: OD_API_TOKEN
        generateValue: true
      - key: OD_BIND_HOST
        value: "0.0.0.0"
      - key: OD_PORT
        value: "10000"
